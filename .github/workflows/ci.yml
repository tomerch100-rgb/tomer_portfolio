name: Pre-Deployment Full CI

on:
  push:
    branches:
      - '**' # מאזין לכל בראנץ' כדי להריץ את ה-Pytest
  pull_request:
    branches:
      - main
      - staging

jobs:
  # 1. בדיקת סגנון ואבטחה ל-Backend (רץ תמיד)
  backend-lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # עודכן לגרסה המקומית שלך
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt # מותאם למבנה ה-backend
      - name: Install Lint & Security Tools
        run: |
          pip install ruff pip-audit bandit
      - name: Run Linter (Ruff)
        run: ruff check backend/
      - name: Check Vulnerable Dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Run Security Analysis (Bandit)
        run: bandit -r backend/app/ -ll

  # 2. הרצת הבדיקות האוטומטיות (Pytest - רץ תמיד)
  backend-tests:
    needs: backend-lint-and-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # עודכן לגרסה המקומית שלך
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx playwright anyio pillow openpyxl pydantic
      - name: Run Pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          ALGORITHM: "HS256"
          ENVIRONMENT: "testing"
        # פוצל לשתי שורות נפרדות כדי למנוע התנגשויות בזיכרון וב-DB!
        run: |
          pytest tests/unit -v --cov=backend/app --cov-fail-under=70
          pytest tests/integration -v

  # 3. אימות קומפילציה של הפרונטאנד (רץ תמיד)
  frontend-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # 4. בדיקות קצה-לקצה בדפדפן (Playwright - רץ *רק* ב-staging וב-main)
  e2e-playwright-tests:
    needs: [backend-tests, frontend-build-check]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' # עודכן לגרסה המקומית שלך
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-playwright pytest-asyncio anyio pillow openpyxl pydantic
          
      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium
        
      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          ALGORITHM: "HS256"
        run: pytest tests/e2e -v 
