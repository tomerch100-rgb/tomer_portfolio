name: Pre-Deployment Full CI

on:
  push:
    branches:
      - '**' # מאזין לכל בראנץ' כדי להריץ בדיקות קוד מהירות (Linter + Pytest)
  pull_request:
    branches:
      - main
      - staging

jobs:
  # 1. בדיקת סגנון ואבטחה ל-Backend (רץ תמיד בכל בראנץ')
  backend-lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Lint & Security Tools
        run: |
          pip install ruff pip-audit bandit
      - name: Run Linter (Ruff)
        run: ruff check backend/ tests/
      - name: Check Vulnerable Dependencies
        run: pip-audit -r requirements.txt
      - name: Run Security Analysis (Bandit)
        run: bandit -r backend/ -ll

  # 2. הרצת בדיקות יחידה ואינטגרציה (Pytest - רץ תמיד בכל בראנץ')
  backend-tests:
    needs: backend-lint-and-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      - name: Run Pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          ALGORITHM: "HS256"
        run: pytest tests/unit tests/integration -v --cov=backend --cov-fail-under=70

  # 3. אימות קומפילציה של הפרונטאנד (רץ תמיד בכל בראנץ')
  frontend-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # 4. בדיקות קצה-לקצה בדפדפן (Playwright E2E)
  # רץ אך ורק על הבראנצ'ים staging ו-main (או ב-Pull Request אליהם)
  e2e-playwright-tests:
    needs: [backend-tests, frontend-build-check]
    if: |
      github.ref == 'refs/heads/main' || 
      github.ref == 'refs/heads/staging' || 
      github.base_ref == 'main' || 
      github.base_ref == 'staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest pytest-playwright pytest-asyncio pillow openpyxl pydantic

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      - name: Start Frontend Dev Server
        working-directory: ./frontend
        run: npm run dev &

      - name: Wait for Server to be Ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5173 | grep -q "html"; then
              echo "Server is ready and serving HTML!"
              exit 0
            fi
            echo "Waiting for frontend server... ($i/30)"
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run Playwright E2E Tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret-key"
          ALGORITHM: "HS256"
        run: pytest tests/e2e -v