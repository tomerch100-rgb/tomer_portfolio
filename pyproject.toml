[project]
name = "tomervest"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "node_modules",
    "dist",
    "build",
    "alembic"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Do not perform function calls in argument defaults (FastAPI Depends)
    "B904",  # Within an except clause, raise exceptions with from err
    "B905",  # zip() without explicit strict=
    "E501",  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"backend/app/services/portfolio_function.py" = ["F403"]
"__init__.py" = ["F401"]
"backend/app/schemas/__init__.py" = ["F401"]
"backend/app/models/__init__.py" = ["F401"]
"backend/app/crud/__init__.py" = ["F401"]
"backend/app/services/__init__.py" = ["F401"]
"backend/app/services/portfolio/__init__.py" = ["F401"]
"backend/app/services/portfolio_import/__init__.py" = ["F401"]
