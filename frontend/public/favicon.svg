<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#09090b"/>
      <stop offset="100%" stopColor="#18181b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#059669"/>
      <stop offset="50%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#emeraldGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Candlestick / Bar Chart Elements in Background -->
  <rect x="15" y="34" width="4" height="14" rx="2" fill="#10b981" fill-opacity="0.3"/>
  <rect x="25" y="26" width="4" height="22" rx="2" fill="#10b981" fill-opacity="0.4"/>
  <rect x="35" y="18" width="4" height="30" rx="2" fill="#10b981" fill-opacity="0.5"/>
  <rect x="45" y="12" width="4" height="36" rx="2" fill="#10b981" fill-opacity="0.6"/>

  <!-- Trending Line & Arrow with Glow -->
  <path d="M12 44L24 32L34 38L50 16" stroke="url(#emeraldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Arrow Head -->
  <path d="M40 16H50V26" stroke="url(#emeraldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Glowing Dot at peak -->
  <circle cx="50" cy="16" r="3" fill="#ffffff" />
</svg>
